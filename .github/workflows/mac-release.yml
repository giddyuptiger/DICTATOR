# Auto-build, sign, notarize, and publish the Mac app as a downloadable .dmg.
#
# This is the Mac equivalent of the iOS TestFlight pipeline. The Mac app is NOT
# App Store / TestFlight eligible (non-sandboxed, uses a global hotkey +
# Accessibility), so it ships as a Developer-ID-signed, notarized .dmg on a
# GitHub Release instead.
#
# TRIGGER: push a tag matching `mac-v*` (e.g. `mac-v0.1.26`), or run manually
# from the Actions tab. Tag-based on purpose — macOS runner minutes are costly
# (10x), so we release on intent, not on every commit.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_CERT_P12_BASE64  base64 of your exported "Developer ID
#                                 Application" certificate (.p12)
#   DEVELOPER_ID_CERT_PASSWORD    the password you set when exporting the .p12
#   AC_API_KEY_ID                 App Store Connect API key ID (for notarytool)
#   AC_API_ISSUER_ID              App Store Connect API issuer ID
#   AC_API_KEY_P8_BASE64          base64 of the downloaded AuthKey_XXXX.p8
#
# OPTIONAL, for Sparkle auto-update (BUILD.md "Mac auto-update"):
#   SPARKLE_PRIVATE_ED_KEY        secret: the EdDSA private key from Sparkle's
#                                 generate_keys (-x); signs the DMG
#   SPARKLE_PUBLIC_ED_KEY         repository VARIABLE (not secret): the matching
#                                 public key, written into Info.plist before the
#                                 archive. With both set, every mac-v* release
#                                 also appends an item to docs/appcast.xml on
#                                 main, which the site serves to installed apps.
#
# See README/BUILD.md for exactly how to create each of these.

name: Mac Release

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release

jobs:
  build:
    # macos-15 ships Xcode 16, which can read the project format (77) that
    # xcodegen emits. macos-14's default Xcode 15.4 cannot, and fails at
    # -resolvePackageDependencies with "future Xcode project file format (77)".
    # We still pin the Xcode below so a runner-image change can't silently move
    # us back onto an older default.
    runs-on: macos-15
    env:
      SCHEME: "Dictator (Mac)"
      TEAM_ID: W9K8HB89TY
    steps:
      - uses: actions/checkout@v4

      # Diagnostic: prints only the LENGTH of each secret, never its value, so we
      # can tell "secret not visible to this run" (length 0) from "secret present
      # but malformed" (length > 0). Safe to leave in — lengths leak nothing.
      - name: Check secret presence (lengths only)
        env:
          A: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          B: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          C: ${{ secrets.AC_API_KEY_ID }}
          D: ${{ secrets.AC_API_ISSUER_ID }}
          E: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          echo "DEVELOPER_ID_CERT_P12_BASE64 length: ${#A}"
          echo "DEVELOPER_ID_CERT_PASSWORD   length: ${#B}"
          echo "AC_API_KEY_ID                length: ${#C}"
          echo "AC_API_ISSUER_ID             length: ${#D}"
          echo "AC_API_KEY_P8_BASE64         length: ${#E}"

      - name: Select Xcode 16+
        run: |
          set -euo pipefail
          # Pick the newest installed Xcode 16 or later, then pin it. If the glob
          # matches nothing we leave xcode-select's default in place.
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_1[7-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${latest:-}" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain first in the search list so xcodebuild finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)

      # Sparkle needs the public key in the app and a build number that grows
      # every release (it compares CFBundleVersion, and the project's static "1"
      # would never look newer). The run number grows; the marketing version is
      # what people see.
      - name: Sparkle public key into Info.plist
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_PUBLIC_ED_KEY" macOS/Info.plist
            echo "Sparkle public key set (length ${#SPARKLE_PUBLIC_ED_KEY})"
          else
            echo "SPARKLE_PUBLIC_ED_KEY not set: the app will not self-update"
          fi

      - name: Archive (Developer ID, hardened runtime)
        run: |
          set -euo pipefail
          xcodebuild -project Dictator.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            archive

      - name: Export the app
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dictator.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Notarize and staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Dictator.app"
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Dictator-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Dictator-notarize.zip" \
            --key "$RUNNER_TEMP/ac_key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Build DMG (branded)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Dictator.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist" 2>/dev/null || echo dev)
          # Stable name (NOT versioned) so the website's
          # releases/latest/download/Dictator.dmg link always resolves.
          DMG="$RUNNER_TEMP/Dictator.dmg"
          rm -f "$DMG"

          # HiDPI-aware background: a TIFF holding the 1x (660x400) and 2x
          # (1320x800) art, so the window is crisp on Retina and correctly sized
          # elsewhere. Fall back to the 1x PNG if the 2x asset is missing.
          BG="design/dmg-background.png"
          if [ -f "design/dmg-background@2x.png" ]; then
            tiffutil -cathidpicheck design/dmg-background.png "design/dmg-background@2x.png" \
              -out "$RUNNER_TEMP/dmg-bg.tiff" && BG="$RUNNER_TEMP/dmg-bg.tiff"
          fi

          # dmgbuild writes the background + icon layout into the DMG itself (no
          # Finder/AppleScript), so it works on this headless runner. Prefer pipx;
          # fall back to a --user pip install.
          if command -v pipx >/dev/null 2>&1; then
            DMGBUILD="pipx run dmgbuild"
          else
            python3 -m pip install --user --quiet dmgbuild \
              || python3 -m pip install --user --quiet --break-system-packages dmgbuild
            export PATH="$(python3 -m site --user-base)/bin:$PATH"
            DMGBUILD="dmgbuild"
          fi

          # If styling fails for any reason, fall back to a plain (unstyled) DMG so
          # a release is never blocked by cosmetics.
          if $DMGBUILD -s scripts/dmg_settings.py -D app="$APP" -D bg="$BG" "Dictator" "$DMG"; then
            echo "Built branded DMG via dmgbuild"
          else
            echo "dmgbuild failed — falling back to a plain hdiutil DMG"
            STAGE="$RUNNER_TEMP/dmg"; mkdir -p "$STAGE"
            cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "Dictator" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          fi

          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('mac-v{0}-run{1}', env.VERSION, github.run_number) }}
          name: Dictator for Mac ${{ env.VERSION }}
          files: ${{ env.DMG_PATH }}
          generate_release_notes: true

      # Sign the DMG for Sparkle and publish the appcast item on main, so the
      # site (docs/, served at trydictator.com) offers this release to every
      # installed copy. Skipped, with a note, when the key is not configured.
      - name: Sparkle — sign the DMG and update the appcast
        if: ${{ github.ref_type == 'tag' }}
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_ED_KEY" ]; then
            echo "SPARKLE_PRIVATE_ED_KEY not set: skipping the appcast"; exit 0
          fi
          SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData "$RUNNER_TEMP" -type f -name sign_update -path "*parkle*" 2>/dev/null | head -1 || true)
          if [ -z "$SIGN_UPDATE" ]; then
            # The archive resolved the package; its artifact bundle holds the tools.
            SIGN_UPDATE=$(find / -type f -name sign_update -path "*parkle*" 2>/dev/null | head -1 || true)
          fi
          [ -n "$SIGN_UPDATE" ] || { echo "sign_update not found in the Sparkle artifact bundle"; exit 1; }
          chmod +x "$SIGN_UPDATE"
          OUT=$("$SIGN_UPDATE" -s "$SPARKLE_PRIVATE_ED_KEY" "$DMG_PATH")
          echo "sign_update: $OUT"
          SIG=$(echo "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LEN=$(echo "$OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          [ -n "$SIG" ] && [ -n "$LEN" ] || { echo "could not parse the signature"; exit 1; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Dictator.dmg"
          NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          python3 scripts/sparkle_appcast.py --version "$BUILD_NUMBER" --short "$VERSION" \
            --url "$URL" --length "$LEN" --signature "$SIG" --notes-url "$NOTES"
          git add docs/appcast.xml
          git commit -m "appcast: Dictator for Mac $VERSION (build $BUILD_NUMBER, $TAG)" || { echo "nothing to commit"; exit 0; }
          git push origin main
