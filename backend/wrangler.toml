# Cloudflare Worker config for the Dictator backend.
# Deploy: `cd backend && npx wrangler deploy`  (see README.md for first-time setup)

name = "dictator-backend"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV namespace for rate-limit + spend counters. OPTIONAL — the Worker runs fine
# without it (rate limiting is simply disabled). To enable it later, list your
# existing namespaces with `npx wrangler kv namespace list`, then uncomment the
# block below and paste the two ids (dictator-backend-RL -> id,
# dictator-backend-RL_preview -> preview_id):
#
# kv_namespaces = [
#   { binding = "RL", id = "PASTE_ID", preview_id = "PASTE_PREVIEW_ID" }
# ]

[vars]
# Tunable, non-secret knobs. Adjust to taste.
GLOBAL_DAILY_CAP = "50000"   # hard stop: total backend requests/day before 503
DEVICE_RPM = "20"            # per-device requests/minute
IP_RPM = "40"                # per-IP requests/minute

# SECRET (never in this file). Set once with:
#   npx wrangler secret put GROQ_API_KEY
