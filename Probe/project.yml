# Standalone probe project. Answers one question: can a keyboard extension open
# the microphone on this phone, on this iOS version?
#
#   cd Probe && xcodegen generate && open MicProbe.xcodeproj
#
# Then: run on a REAL device, add the keyboard in Settings, turn on Full Access,
# open Notes, switch to MicProbe, press the button.

name: MicProbe

options:
  bundleIdPrefix: design.irons.micprobe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: W9K8HB89TY
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  MicProbe:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: ProbeKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.irons.micprobe
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  ProbeKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.irons.micprobe.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  MicProbe:
    build:
      targets:
        MicProbe: all
        ProbeKeyboard: all
    run:
      config: Debug
