<?xml version="1.0" encoding="UTF-8"?>
<!-- Dictator app icon — the soundwave forms the sunglasses (two lenses), with the
     wave running out as the temple arms, and a handlebar mustache below. Green neon
     on dark. 1024x1024; export to PNG for the icon (no transparency, no text). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1A15"/>
      <stop offset="1" stop-color="#070B09"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4BF0A8"/>
      <stop offset="1" stop-color="#18BE6E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g fill="none" stroke="url(#green)" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">

    <!-- left lens + right lens (the sunglasses) -->
    <circle cx="410" cy="430" r="82"/>
    <circle cx="614" cy="430" r="82"/>
    <!-- bridge over the nose -->
    <path d="M492 416 Q512 398 532 416"/>

    <!-- the soundwave runs out of each lens as the temple arms -->
    <polyline points="328,430 306,404 286,456 264,408 242,452 220,414 198,442 176,430"/>
    <polyline points="696,430 718,404 738,456 760,408 782,452 804,414 826,442 848,430"/>

    <!-- handlebar mustache -->
    <path d="M512 606
             C 456 636, 410 632, 380 602
             C 352 574, 360 538, 392 536
             C 416 535, 420 562, 402 574"/>
    <path d="M512 606
             C 568 636, 614 632, 644 602
             C 672 574, 664 538, 632 536
             C 608 535, 604 562, 622 574"/>
  </g>
</svg>
