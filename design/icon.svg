<?xml version="1.0" encoding="UTF-8"?>
<!-- Dictator app icon — minimal green line art: soundwave + sunglasses + mustache.
     1024x1024. Open in a browser to view; export to PNG at 1024 for the app icon
     (icons can't be transparent, so keep the dark background). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37E39B"/>
      <stop offset="1" stop-color="#12A45C"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1A16"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
  </defs>

  <!-- background (full-bleed; iOS masks the corners) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- soundwave: rounded bars -->
  <g fill="url(#g)">
    <rect x="272" y="312" width="20" height="56"  rx="10"/>
    <rect x="318" y="280" width="20" height="120" rx="10"/>
    <rect x="364" y="298" width="20" height="84"  rx="10"/>
    <rect x="410" y="250" width="20" height="180" rx="10"/>
    <rect x="456" y="285" width="20" height="110" rx="10"/>
    <rect x="502" y="235" width="20" height="210" rx="10"/>
    <rect x="548" y="285" width="20" height="110" rx="10"/>
    <rect x="594" y="250" width="20" height="180" rx="10"/>
    <rect x="640" y="298" width="20" height="84"  rx="10"/>
    <rect x="686" y="280" width="20" height="120" rx="10"/>
    <rect x="732" y="312" width="20" height="56"  rx="10"/>
  </g>

  <!-- sunglasses -->
  <g fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="300" y="500" width="170" height="120" rx="46"/>
    <rect x="554" y="500" width="170" height="120" rx="46"/>
    <!-- bridge over the nose -->
    <path d="M470 528 Q512 508 554 528"/>
    <!-- temple arms -->
    <path d="M300 522 L266 504"/>
    <path d="M724 522 L758 504"/>
  </g>

  <!-- handlebar mustache -->
  <g fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 706
             C 470 728, 430 726, 402 708
             C 374 690, 368 666, 392 662
             C 410 659, 416 678, 404 690"/>
    <path d="M512 706
             C 554 728, 594 726, 622 708
             C 650 690, 656 666, 632 662
             C 614 659, 608 678, 620 690"/>
  </g>
</svg>
