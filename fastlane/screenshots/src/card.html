<!doctype html>
<!--
  App Store screenshot card, 1284x2778 (iPhone 6.5"). Rendered headless by
  make.py, which fills the {{...}} fields. Matches the style of the launch set:
  green-black gradient, bold two-line headline with a mint accent line, a quiet
  subline, and the phone screenshot in a rounded frame running off the bottom.

  Rule learned from the 1.0 (122) rejection (guideline 2.3.7): no price words
  anywhere on a screenshot. Not "free", not "no subscription", not "$15/month".
-->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Inter variable font (100-900), one file from Google Fonts. */
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("{{FONT_DIR}}/Inter.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1284px; height: 2778px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #0f2b22 0%, #12201c 22%, #131416 45%, #0e0f11 100%);
    font-family: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .headline {
    position: absolute; left: 80px; right: 80px; top: 214px;
    text-align: center; color: #ffffff;
    font-weight: 800; font-size: 104px; line-height: 1.16; letter-spacing: -0.02em;
  }
  .headline .accent { color: #34d399; }
  .subline {
    position: absolute; left: 120px; right: 120px; top: {{SUBLINE_TOP}}px;
    text-align: center; color: #8b9a95;
    font-weight: 400; font-size: 40px; line-height: 1.3;
  }
  .phone {
    position: absolute; left: 50%; top: {{PHONE_TOP}}px; transform: translateX(-50%);
    width: 1030px; border-radius: 72px; overflow: hidden;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
    background: #000;
  }
  .phone img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="headline">{{HEADLINE}}</div>
  <div class="subline">{{SUBLINE}}</div>
  <div class="phone"><img src="{{PHONE}}"></div>
</body>
</html>
